services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acee
      POSTGRES_PASSWORD: acee_dev_password
      POSTGRES_DB: acee
    ports:
      - "5433:5432"
    volumes:
      - acee_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
  # Local mail catcher: every email the API sends in development lands here (UI: http://localhost:8025).
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  acee_pg:
